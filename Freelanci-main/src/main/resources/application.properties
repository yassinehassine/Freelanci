spring.application.name=Freelanci
# Use H2 database for demo (switch back to MySQL for production)
spring.datasource.url=jdbc:h2:mem:freelanci
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# MySQL Configuration (comment out H2 above and uncomment this for production)
# spring.datasource.url=jdbc:mysql://localhost:3306/Freelanci?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.show-sql=true
# spring.jpa.hibernate.ddl-auto=update

# Internationalization Configuration
spring.messages.basename=messages
spring.messages.default-locale=fr
spring.messages.fallback-to-system-locale=false
