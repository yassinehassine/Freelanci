<!-- src/main/resources/templates/job-list.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job List</title>
</head>
<body>

<h1>Job Listings</h1>

<table border="1">
    <thead>
    <tr>
        <th>Job ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Budget</th>
        <th>Category</th>
        <th>Created At</th>
        <th>Deadline</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <!-- Thymeleaf will iterate over the jobs list and render each job -->
    <tr th:each="job : ${jobs}">
        <td th:text="${job.jobId}"></td>
        <td th:text="${job.title}"></td>
        <td th:text="${job.description}"></td>
        <td th:text="${job.budget}"></td>
        <td th:text="${job.category}"></td>
        <td th:text="${job.createdAt}"></td>
        <td th:text="${job.deadline}"></td>
        <td th:text="${job.projectStatus}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
